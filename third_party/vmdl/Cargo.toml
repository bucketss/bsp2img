[package]
name = "vmdl"
version = "0.2.0"
edition = "2021"
description = "Rust parser for valve model files."
repository = "https://github.com/icewind1991/vmdl"
license = "MIT"
rust-version = "1.70.0"

[dependencies]
arrayvec = "0.7.6"
thiserror = "1.0.63"
static_assertions = "1.1.0"
bitflags = "2.6.0"
itertools = "0.13.0"
tracing = "0.1.40"
bytemuck = { version = "1.17.0", features = ["derive"] }
cgmath = "0.18.0"
num_enum = "0.7.3"
half = "2.4.1"
